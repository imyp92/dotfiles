# ==========================================
# 1. 기본 편의성 설정
# ==========================================
# 기본 Prefix(명령어 진입키)를 Ctrl+b 에서 누르기 편한 Ctrl+a 로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 마우스 스크롤 및 클릭으로 창 크기 조절/선택 허용
set -g mouse on

# 창(Window)과 칸(Pane) 번호를 0이 아닌 1부터 시작 (키보드 숫자 누르기 편하게)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# 2. 직관적인 화면 분할 단축키
# ==========================================
# | 키로 세로 분할, - 키로 가로 분할 (새 창을 열 때 현재 경로 유지)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ==========================================
# 3. 마우스 없이 방향키로 화면 이동 (Alt + 방향키)
# ==========================================
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================
# 4. 미니멀 & Catppuccin 감성 상태줄 (Status Bar)
# ==========================================
# 상태줄을 화면 맨 위로 이동 (시선 분산 방지)
set -g status-position top
# 상태줄 배경을 투명하게, 글자는 기본 색상으로
set -g status-style bg=default,fg=white

# 왼쪽/오른쪽 거추장스러운 정보 제거, 시간만 표시
set -g status-left ""
set -g status-right "#[fg=gray,bg=default]%H:%M "

# 현재 활성화된 탭(초록색 굵게)과 비활성 탭(회색) 디자인
setw -g window-status-current-format "#[fg=green,bold,bg=default] [#I] #W "
setw -g window-status-format "#[fg=gray,bg=default] [#I] #W "
