# ==========================================
# 1. 기본 편의성 설정
# ==========================================
# 기본 Prefix(명령어 진입키)를 Ctrl+b 에서 누르기 편한 Ctrl+a 로 변경
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 마우스 스크롤 및 클릭으로 창 크기 조절/선택 허용
set -g mouse on

# 창(Window)과 칸(Pane) 번호를 0이 아닌 1부터 시작 (키보드 숫자 누르기 편하게)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================================
# 2. 직관적인 화면 분할 단축키
# ==========================================
# | 키로 세로 분할, - 키로 가로 분할 (새 창을 열 때 현재 경로 유지)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ==========================================
# 3. 마우스 없이 방향키로 화면 이동 (Alt + 방향키)
# ==========================================
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================
# 4. 미니멀 & Kanagawa Wave 정통 감성 상태줄 및 분할선
# ==========================================
# 상태줄을 화면 맨 위로 이동 (시선 분산 방지)
set -g status-position top
# 상태줄 배경 투명, 기본 글자는 Kanagawa Fuji White(#DCD7BA)
set -g status-style bg=default,fg="#DCD7BA"

# 왼쪽/오른쪽 거추장스러운 정보 제거, 시간만 Fuji Gray(#727169)로 표시
set -g status-left ""
set -g status-right "#[fg=#727169,bg=default]%H:%M "

# 현재 활성화된 탭(Kanagawa Wave Aqua #7AA89F 굵게)과 비활성 탭(Fuji Gray #727169)
setw -g window-status-current-format "#[fg=#7AA89F,bold,bg=default] [#I] #W "
setw -g window-status-format "#[fg=#727169,bg=default] [#I] #W "

# 분할창 경계선 색상 (활성: Wave Aqua #7AA89F, 비활성: Sumi Ink 3 #2A2A37)
set -g pane-border-style fg="#2A2A37"
set -g pane-active-border-style fg="#7AA89F"

# 설정 파일 동적 새로고침 단축키 (Prefix + r)
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

# escape 딜레이 설정
set -sg escape-time 0
